<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Player preview card -->
  <rect x="24" y="24" width="168" height="104" rx="14" fill="#14171a" stroke="#23272d" stroke-width="1.5" />
  <rect x="38" y="38" width="32" height="16" rx="8" fill="rgba(52,211,153,0.14)" />
  <text x="54" y="49.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#34d399">AD</text>
  <circle cx="108" cy="78" r="24" fill="rgba(52,211,153,0.12)" />
  <path d="M101 66 L101 90 L121 78 Z" fill="#34d399" />
  <rect x="38" y="112" width="140" height="4" rx="2" fill="#23272d" />
  <rect x="38" y="112" width="58" height="4" rx="2" fill="#34d399" />

  <!-- Wrapper script card -->
  <rect x="24" y="140" width="168" height="76" rx="14" fill="#14171a" stroke="#23272d" stroke-width="1.5" />
  <text x="40" y="163" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#34d399">&lt;/&gt;</text>
  <text x="67" y="162.5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8b939c">wrapper.js</text>
  <rect x="40" y="174" width="120" height="5" rx="2.5" fill="#2a2f35" />
  <rect x="40" y="186" width="90" height="5" rx="2.5" fill="#2a2f35" />
  <rect x="40" y="198" width="64" height="5" rx="2.5" fill="#23272d" />

  <!-- Ad player properties panel -->
  <rect x="208" y="24" width="168" height="192" rx="14" fill="#14171a" stroke="#23272d" stroke-width="1.5" />
  <text x="224" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e8eaed">Ad Player Properties</text>
  <line x1="224" y1="58" x2="360" y2="58" stroke="#23272d" stroke-width="1" />

  <!-- Row 1: Autoplay (on) -->
  <text x="224" y="79" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#a8b0b8">Autoplay</text>
  <rect x="322" y="67" width="34" height="16" rx="8" fill="#34d399" />
  <circle cx="348" cy="75" r="6" fill="#0a0b0d" />

  <!-- Row 2: Skip after 5s (off) -->
  <text x="224" y="117" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#a8b0b8">Skip after 5s</text>
  <rect x="322" y="105" width="34" height="16" rx="8" fill="#23272d" stroke="#33383e" />
  <circle cx="330" cy="113" r="6" fill="#8b939c" />

  <!-- Row 3: Mute on load (on) -->
  <text x="224" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#a8b0b8">Mute on load</text>
  <rect x="322" y="143" width="34" height="16" rx="8" fill="#34d399" />
  <circle cx="348" cy="151" r="6" fill="#0a0b0d" />

  <!-- Row 4: Click tracking (on) -->
  <text x="224" y="193" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#a8b0b8">Click tracking</text>
  <rect x="322" y="181" width="34" height="16" rx="8" fill="#34d399" />
  <circle cx="348" cy="189" r="6" fill="#0a0b0d" />
