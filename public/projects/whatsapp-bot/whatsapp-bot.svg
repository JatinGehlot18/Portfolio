<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Chat window -->
  <rect x="112" y="24" width="176" height="192" rx="20" fill="#14171a" stroke="#23272d" stroke-width="1.5" />

  <!-- Header -->
  <circle cx="140" cy="52" r="14" fill="rgba(52,211,153,0.14)" />
  <circle cx="140" cy="48" r="4.2" fill="#34d399" />
  <path d="M132 60c1.5-4.5 5-6.5 8-6.5s6.5 2 8 6.5" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" />
  <text x="162" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#e8eaed">Bill Assistant</text>
  <circle cx="273" cy="46" r="3.5" fill="#34d399" />
  <text x="162" y="61" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#8b939c">online</text>

  <line x1="124" y1="70" x2="276" y2="70" stroke="#23272d" stroke-width="1" />

  <!-- Incoming bubble: personalized video -->
  <rect x="124" y="82" width="140" height="56" rx="14" fill="#1b1f24" />
  <circle cx="146" cy="110" r="15" fill="rgba(52,211,153,0.14)" />
  <path d="M141 102 L141 118 L156 110 Z" fill="#34d399" />
  <rect x="168" y="98" width="80" height="6" rx="3" fill="#2a2f35" />
  <rect x="168" y="110" width="60" height="6" rx="3" fill="#2a2f35" />
  <rect x="168" y="122" width="44" height="6" rx="3" fill="#23272d" />

  <!-- Outgoing bubble -->
  <rect x="176" y="150" width="88" height="30" rx="12" fill="rgba(52,211,153,0.14)" />
  <text x="220" y="169.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#34d399">Thanks!</text>

  <!-- Message input -->
  <rect x="124" y="192" width="152" height="16" rx="8" fill="#191c21" stroke="#23272d" stroke-width="1" />
  <circle cx="255" cy="200" r="4.5" fill="#8b939c" />
</svg>
